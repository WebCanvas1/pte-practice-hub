# Wrangler configuration for the PTE practice portal Worker.
#
# The Vite/Nitro build emits a Cloudflare Worker bundle in `dist/`; this file
# declares the bindings the Worker API expects at runtime. Secrets are NOT
# stored here — set them with `wrangler secret put <NAME>`.

name = "pte-portal"
main = "dist/server/index.mjs"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist/client"
binding = "ASSETS"

[vars]
APP_URL = "https://pte-portal.example.com"
SUPPORT_EMAIL = "support@scorepath.example"
AI_WRITING_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_SPEAKING_MODEL = "@cf/meta/llama-3.1-8b-instruct-fast"
AI_TRANSCRIPTION_MODEL = "@cf/openai/whisper-large-v3-turbo"

[ai]
binding = "AI"

# Relational data: users, profiles, sessions, tokens, audit logs, settings
[[d1_databases]]
binding = "DB"
database_name = "pte_portal"
database_id = "00523f5d-56d8-4aaf-8472-657c605bcb21"
migrations_dir = "migrations"

# Platform settings / cached config
[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "117de9c53b7b42388ae4f598f901bdbe"

# Session lookups and login rate-limit counters
[[kv_namespaces]]
binding = "SESSIONS_KV"
id = "24b60fa9e882467baf37d8654c74455e"

# Audio recordings and future media assets
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "pte-portal-media"

# Secrets (set via `wrangler secret put`):
# SESSION_SECRET
# ADMIN_SETUP_SECRET
# STRIPE_SECRET_KEY
# STRIPE_WEBHOOK_SECRET
# STRIPE_PUBLISHABLE_KEY
# CLOUDFLARE_ACCOUNT_ID (only needed by CI / API tooling)

# Optional ingestion orchestration bindings. Create the resources before
# uncommenting; the application uses a safe inline/database fallback initially.
# [[queues.producers]]
# binding = "CONTENT_IMPORT_QUEUE"
# queue = "pte-content-imports"
#
# [[vectorize]]
# binding = "QUESTION_VECTORS"
# index_name = "pte-question-vectors"
